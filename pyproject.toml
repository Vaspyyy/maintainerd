[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maintainerd"
version = "0.4.0"
description = "Small, subscription-backed autonomous maintainer experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
maintainerd = "maintainerd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
