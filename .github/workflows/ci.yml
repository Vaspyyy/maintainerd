name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Offline tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          maintainerd --version
          maintainerd --help
